[project]
name = "referral-intake"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "python-dotenv",
    "python-multipart",
    "pdf2image",
    "pytesseract",
    "pillow",
    "numpy",
    "sqlalchemy>=2",
    "psycopg2-binary",
    "pgvector",
    "sentence-transformers",
    "reportlab",
    "matplotlib",
    "mcp",
    "pytest",
]

[tool.setuptools]
packages = ["app", "ris", "evals"]

[tool.pytest.ini_options]
pythonpath = ["."]
